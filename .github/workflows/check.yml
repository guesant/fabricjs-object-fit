name: Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npx nx run fabricjs-object-fit:lint

      - name: Test
        run: npx nx run fabricjs-object-fit:test

      - name: Build
        run: npx nx run fabricjs-object-fit:build

      # - name: Install Playwright browsers
      #   run: npx playwright install --with-deps chromium firefox

      # - name: E2E tests
      #   run: npx nx run fabricjs-object-fit:test:e2e

      - name: Docs
        run: npx nx run docs:build
