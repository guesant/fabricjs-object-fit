name: Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Lint
        run: pnpm exec nx run fabricjs-object-fit:lint

      - name: Test
        run: pnpm exec nx run fabricjs-object-fit:test

      - name: Build
        run: pnpm exec nx run fabricjs-object-fit:build

      - name: Install Playwright browsers
        run: pnpm --filter fabricjs-object-fit exec playwright install --with-deps chromium firefox

      - name: E2E tests
        run: pnpm exec nx run fabricjs-object-fit:test:e2e

      - name: Docs
        run: pnpm exec nx run docs:build
