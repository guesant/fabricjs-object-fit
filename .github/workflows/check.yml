name: Check

on:
  push:
    branches:
      - dev
  pull_request:
    branches:
      - dev

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: src/package-lock.json

      - name: Install dependencies
        run: cd src && npm ci

      - name: Lint
        run: cd src && npx nx run fabricjs-object-fit:lint

      - name: Test
        run: cd src && npx nx run fabricjs-object-fit:test

      - name: Build
        run: cd src && npx nx run fabricjs-object-fit:build
